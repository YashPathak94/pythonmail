{{- if .Values.routing.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "portal-service.fullname" . }}
  labels:
    {{- include "portal-service.labels" . | nindent 4 }}
  {{- with .Values.routing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.routing.className }}
  ingressClassName: {{ .Values.routing.className }}
  {{- end }}
  rules:
    {{- if .Values.routing.host }}
    - host: {{ .Values.routing.host | quote }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          - path: "/{{ trimPrefix "/" (required "routing.lbPath is required" .Values.routing.lbPath) }}"
            pathType: Prefix
            backend:
              service:
                name: {{ include "portal-service.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}


