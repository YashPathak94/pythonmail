  sourceNamespaces:
    - argocd

  sourceRepos:
    - >-
      https://codeconnections.us-east-1.amazonaws.com/git-http/440179238055/us-east-1/969ad1f0-ea28-4624-86fd-736962d07136/EKS/ven-helm-charts.git

  destinations:
    - server: arn:aws:eks:us-east-1:440179238055:cluster/ven-eks-idev
      namespace: annuity-admin-dev

    - server: arn:aws:eks:us-east-1:440179238055:cluster/ven-eks-idev
      namespace: annuity-admin-devb

    - server: arn:aws:eks:us-east-1:440179238055:cluster/ven-eks-idev
