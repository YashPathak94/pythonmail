apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: annuity-admin-services
  namespace: argocd

spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  # Helpful while migrating. Deleting the ApplicationSet will not
  # automatically delete all deployed resources.
  syncPolicy:
    preserveResourcesOnDeletion: true

  generators:
    - matrix:
        generators:

          # Services
          - list:
              elements:
                - service: annuity-agent-api
                  valuesFile: annuity-agent-api.yaml

                - service: annuity-contract-entity-api
                  valuesFile: annuity-contract-entity-api.yaml

                - service: annuity-contract-financial-api
                  valuesFile: annuity-contract-financial-api.yaml

                - service: annuity-utility-services
                  valuesFile: annuity-utility-services.yaml

          # Environments and destination namespaces
          - list:
              elements:
                - environment: dev
                  namespace: annuity-admin-dev

                - environment: devb
                  namespace: annuity-admin-devb

                - environment: devc
                  namespace: annuity-admin-devc

  template:
    metadata:
      name: '{{ .service }}-{{ .environment }}'

      labels:
        application: '{{ .service }}'
        application-group: annuity-admin
        environment: '{{ .environment }}'

    spec:
      project: annuity-admin

      source:
        repoURL: >-
          https://codeconnections.us-east-1.amazonaws.com/git-http/440179238055/us-east-1/969ad1f0-ea28-4624-86fd-736962d07136/EKS/ven-helm-charts.git

        targetRevision: master
        path: annuity-services

        helm:
          # Keep Application name and Helm release name identical.
          releaseName: '{{ .service }}-{{ .environment }}'

          valueFiles:
            - values/common.yaml
            - 'values/applications/{{ .valuesFile }}'
            - 'values/environments/{{ .environment }}.yaml'
            - 'values/overrides/{{ .environment }}/{{ .valuesFile }}'

          parameters:
            - name: applicationName
              value: '{{ .service }}'

            - name: environment
              value: '{{ .environment }}'

            - name: fullnameOverride
              value: '{{ .service }}-{{ .environment }}'

      destination:
        server: arn:aws:eks:us-east-1:440179238055:cluster/ven-eks-idev
        namespace: '{{ .namespace }}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - ApplyOutOfSyncOnly=true
          - PruneLast=true

