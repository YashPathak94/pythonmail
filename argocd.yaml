pipeline {
  agent any

  parameters {
    choice(
      name: 'SERVICE',
      choices: [
        'profile-services',
        'portal-claims-api',
        'email-services',
        'document-engine',
        'sharepoint-services',
        'audit-services',
        'portal-adminmodule-api',
        'portal-lobreport-services',
        'portal-customer-api',
        'portal-professional-api',
        'portal-userprofile-api',
        'portal-commission-services',
        'portal-csr-api'
      ],
      description: 'Service whose image was built'
    )
    choice(
      name: 'ENVIRONMENT',
      choices: ['dev', 'devb', 'devc'],
      description: 'GitOps target environment'
    )
    string(
      name: 'IMAGE_TAG',
      defaultValue: '',
      description: 'Immutable ECR image tag or digest'
    )
  }

  stages {
    stage('Validate') {
      steps {
        sh '''
          set -euo pipefail
          test -n "${IMAGE_TAG}"
          test -f "portal-services/catalog/services/${SERVICE}.yaml"
          test -f "portal-services/values/overrides/${ENVIRONMENT}/${SERVICE}.yaml"
        '''
      }
    }

    stage('Update desired state') {
      steps {
        sh '''
          set -euo pipefail

          FILE="portal-services/values/overrides/${ENVIRONMENT}/${SERVICE}.yaml"
          export IMAGE_TAG
          yq -i '.image.tag = strenv(IMAGE_TAG)' "${FILE}"

          git checkout -b "deploy/${SERVICE}-${ENVIRONMENT}-${IMAGE_TAG}"
          git add "${FILE}"
          git commit -m "Deploy ${SERVICE}:${IMAGE_TAG} to ${ENVIRONMENT}"
          git push origin HEAD

          echo "Create a pull request for the branch."
          echo "After merge, only ${SERVICE}-${ENVIRONMENT} becomes OutOfSync."
        '''
      }
    }
  }
}


