apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portal-service.fullname" . }}
  labels:
    {{- include "portal-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "portal-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        prometheus.io/path: "/{{ .Values.app.name }}/actuator/prometheus"
      labels:
        {{- include "portal-service.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "portal-service.fullname" . }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "portal-service.fullname" . }}
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: https
              containerPort: {{ .Values.container.port }}
              protocol: TCP
          env:
            - name: JAVA_OPTIONS
              value: {{ .Values.runtime.javaOptions | quote }}
            - name: JAVA_OPTS
              value: "{{ .Values.runtime.javaOpts }} -Daws.region={{ .Values.runtime.region }}"
            - name: OTEL_PROPAGATORS
              value: {{ .Values.runtime.otelPropagators | quote }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.runtime.activeProfile | quote }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.container.port }}
              scheme: HTTPS
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            successThreshold: {{ .Values.probes.liveness.successThreshold }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.container.port }}
              scheme: HTTPS
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.probes.readiness.successThreshold }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.catalina.enabled }}
            - name: catalina
              mountPath: {{ .Values.catalina.mountPath }}
              subPath: catalina.properties
            {{- end }}
            {{- if .Values.secretMounts.chaincert.enabled }}
            - name: chaincert
              mountPath: {{ .Values.secretMounts.chaincert.mountPath }}
              subPath: {{ .Values.secretMounts.chaincert.subPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.secretMounts.serverXml.enabled }}
            - name: serverxml
              mountPath: {{ .Values.secretMounts.serverXml.mountPath }}
              subPath: {{ .Values.secretMounts.serverXml.subPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            {{- range .Values.persistence.claims }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
            {{- end }}
      volumes:
        {{- if .Values.catalina.enabled }}
        - name: catalina
          configMap:
            name: {{ include "portal-service.fullname" . }}-catalina
            items:
              - key: catalina.properties
                path: catalina.properties
        {{- end }}
        {{- if .Values.secretMounts.chaincert.enabled }}
        - name: chaincert
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ required "chaincert secretProviderClass is required" .Values.secretMounts.chaincert.secretProviderClass | quote }}
        {{- end }}
        {{- if .Values.secretMounts.serverXml.enabled }}
        - name: serverxml
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ required "serverXml secretProviderClass is required" .Values.secretMounts.serverXml.secretProviderClass | quote }}
        {{- end }}
        {{- if .Values.persistence.enabled }}
        {{- range .Values.persistence.claims }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: {{ include "portal-service.fullname" $ }}-{{ .name }}
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

