{{- if .Values.persistence.enabled }}
{{- range $index, $claim := .Values.persistence.claims }}
{{- if gt $index 0 }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "portal-service.fullname" $ }}-{{ $claim.name }}
  labels:
    {{- include "portal-service.labels" $ | nindent 4 }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ required "persistence.storageClassName is required" $.Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ $claim.size }}
{{- end }}
{{- end }}

